<!doctype html><html lang="pt-BR" data-t="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caça-Promo</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16181c;--mut:#69707a;--line:#dde2e8;--tag:#ffc21a;--tagink:#1a1400;--ok:#14804a}
:root[data-t=dark]{--bg:#0f1115;--card:#181b21;--ink:#eef0f3;--mut:#8f97a3;--line:#262b33;--ok:#4cc38a}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:22px;font-weight:800;flex:1;letter-spacing:-.5px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:99px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:8px;padding:8px 0 0}
input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
main{padding:12px 16px 40px;display:grid;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-decoration:none;color:inherit;position:relative}
.card img{width:96px;height:64px;object-fit:cover;border-radius:10px;background:var(--line);flex:none}
.card h3{font-size:15px;font-weight:600;line-height:1.25;margin-bottom:4px}
.meta{color:var(--mut);font-size:12px}
.price{font-weight:800;font-size:17px;color:var(--ok)}
.old{color:var(--mut);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:400}
.off{position:absolute;right:10px;bottom:10px;background:var(--tag);color:var(--tagink);font-weight:900;font-size:15px;padding:3px 9px;border-radius:6px 12px 6px 12px;transform:rotate(-3deg)}
.msg{text-align:center;color:var(--mut);padding:40px 10px}
#dr{position:fixed;inset:0;background:#0009;display:none;z-index:9}
#dr.open{display:block}
#pn{position:absolute;right:0;top:0;bottom:0;width:min(340px,88%);background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 16px 16px;overflow:auto}
#pn h2{font-size:14px;margin:18px 0 8px}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--tag);color:var(--tagink);border-color:var(--tag);font-weight:700}
textarea{min-height:64px;font-size:13px;margin-bottom:6px}
@media(prefers-reduced-motion:no-preference){.card:active{transform:scale(.985)}}
</style></head><body>
<header><div class="top"><h1>Caça-Promo</h1><button id="rf" aria-label="Atualizar">↻</button><button id="mn" aria-label="Menu">☰</button></div>
<div class="chips" id="ch"></div>
<div class="bar"><input id="q" type="search" placeholder="Buscar nesta categoria"><button id="so">Maior desconto</button></div></header>
<main id="ls"></main>
<div id="dr"><div id="pn">
<h1>Menu</h1>
<h2>Tema</h2><div class="seg" id="th"><button data-v="dark">Escuro</button><button data-v="light">Claro</button><button data-v="auto">Auto</button></div>
<h2>Fontes extras (feeds RSS, um link por linha)</h2><div id="fd"></div>
<button id="sv" style="width:100%;margin-top:8px">Salvar fontes</button>
<p class="meta" style="margin-top:16px">Steam usa a API CheapShark (preços em dólar). As demais categorias mostram os feeds RSS que você adicionar.</p>
<button id="cl" style="width:100%;margin-top:16px">Fechar</button>
</div></div>
<script>
const CATS=[{id:'steam',n:'Steam'},{id:'xbox',n:'Xbox'},{id:'ps',n:'PlayStation'},{id:'hw',n:'Hardware'},{id:'per',n:'Periféricos'},{id:'casa',n:'Casa e cozinha'}];
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let cat=LS('cat','steam'),theme=LS('theme','dark'),feeds=LS('feeds',{}),desc=true,items=[];
function applyTheme(){const t=theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):theme;document.documentElement.dataset.t=t;document.querySelectorAll('#th button').forEach(b=>b.classList.toggle('on',b.dataset.v===theme))}
function chips(){$('#ch').innerHTML=CATS.map(c=>`<button data-id="${c.id}" class="${c.id===cat?'on':''}">${c.n}</button>`).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function steam(){const r=await fetch('https://www.cheapshark.com/api/1.0/deals?storeID=1&onSale=1&pageSize=40&sortBy=Savings');
 return (await r.json()).map(d=>({t:d.title,img:d.thumb,p:'US$ '+(+d.salePrice).toFixed(2),o:'US$ '+(+d.normalPrice).toFixed(2),off:Math.round(+d.savings),url:'https://www.cheapshark.com/redirect?dealID='+d.dealID,m:'Steam'}))}
async function rss(u){const r=await fetch(u);const x=new DOMParser().parseFromString(await r.text(),'text/xml');
 const host=new URL(u).hostname.replace('www.','');
 return [...x.querySelectorAll('item')].map(i=>{const g=t=>i.querySelector(t)?.textContent||'';const t=g('title');
  const m=(t+' '+g('description')).match(/R\$\s?[\d.]+,\d{2}/);const im=i.querySelector('enclosure,thumbnail,content')?.getAttribute('url')||'';
  return{t,img:im,p:m?m[0]:'',o:'',off:0,url:g('link'),m:host+(g('pubDate')?' · '+new Date(g('pubDate')).toLocaleDateString('pt-BR'):'')}})}
async function load(){const L=$('#ls');L.innerHTML='<p class="msg">Buscando promoções…</p>';
 const jobs=[];if(cat==='steam')jobs.push(steam());(feeds[cat]||[]).forEach(u=>jobs.push(rss(u)));
 if(!jobs.length){items=[];return render()}
 const rs=await Promise.allSettled(jobs);items=rs.flatMap(r=>r.status==='fulfilled'?r.value:[]);
 render(rs.some(r=>r.status==='rejected')?'Algumas fontes falharam.':'')}
function render(note=''){const q=$('#q').value.toLowerCase();let a=items.filter(i=>i.t.toLowerCase().includes(q));
 a.sort((x,y)=>desc?y.off-x.off:x.off-y.off);$('#so').textContent=desc?'Maior desconto':'Menor desconto';
 const L=$('#ls');
 if(!a.length){L.innerHTML=`<p class="msg">${items.length?'Nada encontrado.':'Sem fontes aqui ainda. Abra o menu e adicione um feed RSS de promoções.'}</p>`;return}
 L.innerHTML=(note?`<p class="msg" style="padding:0">${note}</p>`:'')+a.map(i=>`<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener">${i.img?`<img loading="lazy" src="${esc(i.img)}" alt="">`:''}<div><h3>${esc(i.t)}</h3><div>${i.p?`<span class="price">${esc(i.p)}</span>`:''}${i.o?`<span class="old">${esc(i.o)}</span>`:''}</div><div class="meta">${esc(i.m)}</div></div>${i.off?`<span class="off">-${i.off}%</span>`:''}</a>`).join('')}
function fdUI(){$('#fd').innerHTML=CATS.map(c=>`<div class="meta">${c.n}</div><textarea data-c="${c.id}" placeholder="https://…/feed">${(feeds[c.id]||[]).join('\n')}</textarea>`).join('')}
$('#ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.id;SV('cat',cat);chips();load()};
$('#q').oninput=()=>render();$('#so').onclick=()=>{desc=!desc;render()};$('#rf').onclick=load;
$('#mn').onclick=()=>$('#dr').classList.add('open');$('#cl').onclick=()=>$('#dr').classList.remove('open');
$('#dr').onclick=e=>{if(e.target.id==='dr')$('#dr').classList.remove('open')};
$('#th').onclick=e=>{const b=e.target.closest('button');if(!b)return;theme=b.dataset.v;SV('theme',theme);applyTheme()};
$('#sv').onclick=()=>{document.querySelectorAll('#fd textarea').forEach(t=>feeds[t.dataset.c]=t.value.split('\n').map(s=>s.trim()).filter(s=>/^https?:\/\//.test(s)));SV('feeds',feeds);$('#dr').classList.remove('open');load()};
applyTheme();chips();fdUI();load();
</script></body></html>

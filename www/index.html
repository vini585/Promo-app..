<!doctype html><html lang="pt-BR" data-t="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caça-Promo</title>
<style>
:root{--bg:#f3f4f8;--s:#fff;--ink:#141622;--mut:#6b7285;--ln:#e1e4ec;--a:#5b2cff;--a2:#e0148c;--ok:#12794a;--on:#fff;--g:none}
:root[data-t=dark]{--bg:#0a0c12;--s:#131723;--ink:#eaedf6;--mut:#8a93a8;--ln:#222a3b;--a:#25e2ff;--a2:#ff3fd0;--ok:#3dffa3;--on:#04060b;--g:0 0 14px #25e2ff66}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 6px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:22px;font-weight:900;flex:1;color:var(--a);letter-spacing:-.5px}
button{font:inherit;color:inherit;background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;transition:.2s}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:99px;padding:6px 13px;font-size:14px}
.chips button.on{background:var(--a);color:var(--on);border-color:var(--a);font-weight:700;box-shadow:var(--g)}
.chips.s button{font-size:13px;padding:4px 11px;background:none}
.chips.s button.on{background:none;color:var(--a2);border-color:var(--a2);box-shadow:none}
input,textarea{font:inherit;color:inherit;background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%}
#q{margin-top:8px}
main{padding:8px 16px calc(90px + env(safe-area-inset-bottom));display:grid;gap:12px;align-content:start}
.card{display:grid;grid-template-columns:92px 1fr;gap:12px;background:var(--s);border:1px solid var(--ln);border-radius:18px;padding:10px;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card img,.ph{width:92px;height:92px;object-fit:cover;border-radius:12px;background:var(--ln);display:grid;place-items:center;font-size:28px}
.tag{font-size:12px;font-weight:700;color:var(--a2)}
.card h3{font-size:15px;font-weight:600;line-height:1.25;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pr b{font-size:19px;color:var(--ok)}
.cp{border-style:dashed;border-color:var(--a);color:var(--a);padding:3px 9px;font-size:13px;border-radius:8px}
.meta{color:var(--mut);font-size:12px;margin-top:4px}
.go{grid-column:1/3;text-align:center;text-decoration:none;color:var(--on);background:var(--a);font-weight:700;padding:9px;border-radius:12px;box-shadow:var(--g)}
.msg{text-align:center;color:var(--mut);padding:36px 12px}
.msg button{margin-top:12px;border-color:var(--a);color:var(--a)}
.sk{height:130px;border-radius:18px;background:linear-gradient(90deg,var(--s) 30%,var(--ln) 50%,var(--s) 70%);background-size:300% 100%;animation:sh 1.2s infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;display:grid;gap:0;font-size:20px;padding:8px 0 6px;color:var(--mut)}
nav button span{font-size:11px}
nav button.on{color:var(--a);text-shadow:var(--g)}
#dr{position:fixed;inset:0;background:#000a;z-index:9;visibility:hidden;opacity:0;transition:.25s}
#dr.open{visibility:visible;opacity:1}
#pn{position:absolute;right:0;top:0;bottom:0;width:min(350px,88%);background:var(--bg);border-left:1px solid var(--a);box-shadow:var(--g);padding:calc(16px + env(safe-area-inset-top)) 16px 20px;overflow:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#dr.open #pn{transform:none}
#pn h2{font-size:14px;margin:20px 0 8px;color:var(--a)}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{border-color:var(--a);color:var(--a);font-weight:700;box-shadow:var(--g)}
.full{width:100%;margin-top:10px}.pri{border-color:var(--a);color:var(--a);font-weight:700}
.lk{display:inline-block;padding:7px 12px;border:1px solid var(--ln);border-radius:99px;background:var(--s);color:inherit;text-decoration:none;margin:0 6px 8px 0;font-size:14px}
.row{display:flex;gap:8px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--s);border:1px solid var(--a);border-radius:14px;padding:12px 14px;z-index:20;transform:translateY(200%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#toast.show{transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="top"><h1>Caça-Promo</h1><button id="rf" aria-label="Atualizar">↻</button><button id="mn" aria-label="Menu">☰</button></div>
<div id="fx"><div class="chips" id="cs"></div><div class="chips s" id="cc"></div><input id="q" type="search" placeholder="Buscar nas ofertas"></div></header>
<main id="v1"></main>
<main id="v2" hidden><div class="row"><input id="sq" type="search" placeholder="Ex.: RTX 4070, air fryer, mouse"><button id="sb" class="pri">Buscar</button></div><div id="sr"></div></main>
<main id="v3" hidden><div class="row"><input id="wn" placeholder="O que vigiar? Ex.: RTX 4060"><button id="wa" class="pri">＋</button></div><p class="meta">Avisamos quando um post novo dos seus canais citar esse nome. O app precisa estar aberto ou em segundo plano.</p><div id="wl" style="display:grid;gap:12px"></div></main>
<nav><button data-v="1" class="on">🔥<span>Ofertas</span></button><button data-v="2">🔎<span>Buscar</span></button><button data-v="3">★<span id="fc">Favoritos</span></button></nav>
<div id="toast"></div>
<div id="dr"><div id="pn">
<h1>Menu</h1>
<h2>Tema</h2><div class="seg" id="th"><button data-v="dark">Preto neon</button><button data-v="light">Branco</button><button data-v="auto">Auto</button></div>
<h2>Canais de ofertas do Telegram</h2>
<textarea id="ch" rows="3" placeholder="@nomedocanal"></textarea>
<p class="meta" style="margin-top:6px">No Telegram, abra o canal, toque no nome dele e copie o @ (o canal precisa ser público). Um por linha.</p>
<button id="sv" class="full pri">Salvar canais</button>
<button id="cl" class="full">Fechar</button>
</div></div>
<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let theme=LS('theme','dark'),chans=LS('chans',[]),watch=LS('watch',[]),items=[],store='',cat='',view=1,failed=false;
const STORES=[['Mercado Livre',/meli\.la|mercadoliv|mercadolib/i],['AliExpress',/aliexpress|ali\.ski/i],['Shopee',/shopee|shp\.ee/i],['Amazon',/amzn\.|amazon\./i],['Magalu',/magazineluiza|magalu/i],['Kabum',/kabum/i],['Terabyte',/terabyte/i],['Pichau',/pichau/i]];
const CATS=[['Hardware',/placa de v[ií]deo|\bgpu\b|\brtx\b|\bgtx\b|radeon|processador|ryzen|core i\d|mem[oó]ria|\bram\b|ddr[345]|\bssd\b|nvme|placa-m[ãa]e|\bfonte\b|gabinete|cooler/i],['Periféricos',/\bmouse|teclado|headset|\bfone|controle|webcam|microfone|stream ?deck|mousepad/i],['Monitores e TV',/monitor|\btv\b|ultrawide/i],['Notebooks',/notebook|laptop|macbook/i],['Casa e cozinha',/geladeira|air ?fryer|fritadeira|fog[ãa]o|micro-?ondas|aspirador|cafeteira|liquidificador|lavadora/i],['Celular e áudio',/celular|smartphone|iphone|galaxy|xiaomi|redmi|\bpoco\b|caixa de som|soundbar|earbuds/i]];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{if(!t)return'';const m=(Date.now()-t)/6e4;return m<60?'há '+Math.max(1,~~m)+' min':m<1440?'há '+~~(m/60)+' h':'há '+~~(m/1440)+' d'};
const parseCh=t=>[...new Set(t.split(/\s+/).map(s=>(s.match(/(?:t\.me\/(?:s\/)?|@)?([A-Za-z][A-Za-z0-9_]{3,31})\/?$/)||[])[1]).filter(Boolean))];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),4500)}
function applyTheme(){document.documentElement.dataset.t=theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):theme;document.querySelectorAll('#th button').forEach(b=>b.classList.toggle('on',b.dataset.v===theme))}
async function tg(u){const h=await (await fetch('https://t.me/s/'+u)).text();const d=new DOMParser().parseFromString(h,'text/html');
 return [...d.querySelectorAll('.tgme_widget_message_wrap')].map(w=>{
  const te=w.querySelector('.tgme_widget_message_text');if(!te)return null;
  const c=te.cloneNode(true);c.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));const txt=c.textContent.trim();
  const links=[...te.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')).filter(x=>/^https?:/.test(x)&&!/t\.me/.test(x));
  const url=links.find(l=>STORES.some(s=>s[1].test(l)))||links[0];if(!url)return null;
  const id=w.querySelector('a.tgme_widget_message_date')?.getAttribute('href')||u+txt.slice(0,40);
  const tm=w.querySelector('time')?.getAttribute('datetime');
  const bg=(w.querySelector('.tgme_widget_message_photo_wrap,.link_preview_image,.link_preview_right_image')?.getAttribute('style')||'').match(/url\(['"]?([^'")]+)/);
  const pr=txt.match(/R\$\s?[\d.]+(?:,\d{2})?/),cp=txt.match(/cupom[:\s]+([A-Za-z0-9]{3,})/i);
  return{id,t:txt.split('\n').map(s=>s.trim()).filter(Boolean)[0]||'Oferta',txt,p:pr?pr[0]:'',cp:cp?cp[1]:'',url,st:(STORES.find(s=>s[1].test(url))||['Outras'])[0],img:bg?bg[1]:'',ts:tm?Date.parse(tm):0,ch:u}}).filter(Boolean)}
async function load(){
 if(!chans.length){items=[];failed=false;return render()}
 $('#v1').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 const rs=await Promise.allSettled(chans.map(tg));const seen=new Set();
 items=rs.flatMap(r=>r.status==='fulfilled'?r.value:[]).filter(i=>!seen.has(i.id)&&seen.add(i.id)).sort((a,b)=>b.ts-a.ts);
 failed=!items.length;if(items.length)check();render()}
const card=(i,n=0)=>`<article class="card" style="animation-delay:${Math.min(n,10)*35}ms">${i.img?`<img loading="lazy" src="${esc(i.img)}" alt="" onerror="this.outerHTML='<div class=ph>🛒</div>'">`:'<div class="ph">🛒</div>'}<div><span class="tag">${esc(i.st)}</span><h3>${esc(i.t)}</h3><div class="pr">${i.p?`<b>${esc(i.p)}</b>`:''}${i.cp?`<button class="cp" data-c="${esc(i.cp)}">🎟 ${esc(i.cp)}</button>`:''}</div><div class="meta">${ago(i.ts)} · @${esc(i.ch)}</div></div><a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Ver oferta</a></article>`;
const hit=(i,t)=>{const ws=norm(t).split(/\s+/).filter(Boolean);const h=norm(i.t+' '+i.txt);return ws.every(x=>h.includes(x))};
function render(){const q=$('#q').value.trim();
 const ss=['',...STORES.map(s=>s[0]).concat('Outras').filter(n=>items.some(i=>i.st===n))];
 $('#cs').innerHTML=ss.map(n=>`<button data-s="${n}" class="${n===store?'on':''}">${n||'Todas'}</button>`).join('');
 const cs=['',...CATS.filter(c=>items.some(i=>c[1].test(i.t+' '+i.txt))).map(c=>c[0])];
 $('#cc').innerHTML=cs.length>1?cs.map(n=>`<button data-c="${n}" class="${n===cat?'on':''}">${n||'Todas'}</button>`).join(''):'';
 const re=CATS.find(c=>c[0]===cat)?.[1];
 const a=items.filter(i=>(!store||i.st===store)&&(!re||re.test(i.t+' '+i.txt))&&(!q||hit(i,q)));
 $('#v1').innerHTML=!chans.length?'<div class="msg">Adicione um canal de ofertas do Telegram para ver as promoções aqui.<br><button id="ac">Adicionar canal</button></div>':failed?'<div class="msg">Não consegui ler os posts. Confira o @ do canal (ele precisa ser público) e a internet.</div>':a.length?a.map(card).join(''):'<div class="msg">Nada encontrado com esse filtro.</div>';
 renderW()}
function check(){watch.forEach(w=>{const m=items.filter(i=>hit(i,w.name));const nw=m.filter(i=>!w.seen.includes(i.id));w.seen=m.map(i=>i.id);
 if(w.init&&nw.length)notify('🔥 '+w.name,nw[0].t+(nw[0].p?' · '+nw[0].p:''));w.init=true});SV('watch',watch)}
const NP=()=>window.Capacitor?.Plugins?.LocalNotifications;
async function notify(t,b){toast(t+' — '+b);try{await NP()?.schedule({notifications:[{id:Math.floor(Math.random()*2e9),title:t,body:b}]})}catch{}}
function addW(n){n=n.trim();if(!n||watch.some(w=>norm(w.name)===norm(n))){toast('Digite um nome que ainda não está na lista.');return false}
 watch.push({id:Date.now()+'',name:n,seen:[],init:false});try{NP()?.requestPermissions()}catch{}check();SV('watch',watch);render();return true}
function renderW(){$('#fc').textContent='Favoritos'+(watch.length?' ('+watch.length+')':'');
 $('#wl').innerHTML=watch.length?watch.map(w=>{const m=items.filter(i=>hit(i,w.name)).slice(0,2);
 return `<div><div class="row" style="align-items:center;margin-bottom:6px"><b style="flex:1">${esc(w.name)}</b><button data-w="${w.id}" aria-label="Remover">✕</button></div>${m.length?m.map(card).join(''):'<p class="meta">Sem promoção nos posts recentes.</p>'}</div>`}).join(''):'<div class="msg">Nada vigiado ainda. Digite um nome acima.</div>'}
function links(t){const e=encodeURIComponent(t),h=e.replace(/%20/g,'-');
 return [['Mercado Livre','https://lista.mercadolivre.com.br/'+h],['AliExpress','https://pt.aliexpress.com/wholesale?SearchText='+e],['Shopee','https://shopee.com.br/search?keyword='+e],['Amazon','https://www.amazon.com.br/s?k='+e],['Kabum','https://www.kabum.com.br/busca/'+e],['Pichau','https://www.pichau.com.br/search?q='+e],['Terabyte','https://www.terabyteshop.com.br/busca?str='+e],['Magalu','https://www.magazineluiza.com.br/busca/'+e+'/'],['Google Shopping','https://www.google.com/search?tbm=shop&q='+e],['Zoom','https://www.zoom.com.br/search?q='+e],['Buscapé','https://www.buscape.com.br/search?q='+e]].map(x=>`<a class="lk" href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join('')}
function search(){const t=$('#sq').value.trim();if(!t)return;const m=items.filter(i=>hit(i,t));
 $('#sr').innerHTML=`<button id="sw" class="full pri">☆ Vigiar "${esc(t)}"</button><div class="meta" style="margin:14px 0 8px">Nas ofertas dos seus canais</div><div style="display:grid;gap:12px">${m.length?m.map(card).join(''):'<p class="meta">Nenhum post recente com esse nome.</p>'}</div><div class="meta" style="margin:16px 0 8px">Comparar preços nas lojas</div>${links(t)}`;
 $('#sw').onclick=()=>{if(addW(t))toast('Vigiando "'+t+'". Veja em Favoritos.')}}
function setV(n){view=n;['#v1','#v2','#v3'].forEach((s,i)=>$(s).hidden=i+1!==n);$('#fx').hidden=n!==1;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',+b.dataset.v===n))}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest('nav button'))return setV(+t.closest('nav button').dataset.v);
 const cp=t.closest('.cp');if(cp){navigator.clipboard?.writeText(cp.dataset.c).then(()=>toast('Cupom '+cp.dataset.c+' copiado'),()=>toast('Cupom: '+cp.dataset.c));return}
 const w=t.closest('[data-w]');if(w){watch=watch.filter(x=>x.id!==w.dataset.w);SV('watch',watch);return render()}
 if(t.closest('#ac'))return $('#dr').classList.add('open');
 const s=t.closest('#cs button');if(s){store=s.dataset.s;return render()}
 const c=t.closest('#cc button');if(c){cat=c.dataset.c;return render()}});
$('#q').oninput=render;$('#rf').onclick=load;$('#sb').onclick=search;$('#sq').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('#wa').onclick=()=>{if(addW($('#wn').value))$('#wn').value=''};
$('#mn').onclick=()=>{$('#ch').value=chans.map(c=>'@'+c).join('\n');$('#dr').classList.add('open')};
$('#cl').onclick=()=>$('#dr').classList.remove('open');
$('#dr').onclick=e=>{if(e.target.id==='dr')$('#dr').classList.remove('open')};
$('#th').onclick=e=>{const b=e.target.closest('button');if(!b)return;theme=b.dataset.v;SV('theme',theme);applyTheme()};
$('#sv').onclick=()=>{chans=parseCh($('#ch').value);SV('chans',chans);$('#dr').classList.remove('open');load()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(load,30*60e3);
applyTheme();load();
</script><script src="extra.js"></script></body></html>
